name: aerovault

services:
  backend:
    build: ./backend
    container_name: aerovault-backend
    env_file:
      - .env
    environment:
      AEROVAULT_ENV: dev
      AEROVAULT_DATA_DIR: /data
      AEROVAULT_LIBRARY_ROOT: /library
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./data:/data
      - ./backend:/app
      - ./Project_Documents:/docs:ro
      - "${AEROVAULT_LIBRARY_ROOT:-./library}:/library:ro"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: aerovault-frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5273:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
